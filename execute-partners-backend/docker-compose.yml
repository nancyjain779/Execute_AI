# AI services only — matches what goes on GitHub
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-api:
    build: ./ai
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/execute-partners-database
    depends_on:
      - mongo

  filter-api:
    build: ./filter
    ports:
      - "7860:7860"
    env_file: .env

volumes:
  mongo_data:
